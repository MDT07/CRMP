<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CRMP - Pipeline Intelligence</title>
  <script>
    // SPA redirect for GitHub Pages
    // Redirects /CRMP/some/path to /CRMP/?redirect=some/path
    const path = window.location.pathname;
    const base = '/CRMP';
    if (path.startsWith(base + '/')) {
      const redirectPath = path.slice(base.length + 1);
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(base + '/?redirect=' + encodeURIComponent(redirectPath + search + hash));
    } else {
      window.location.replace(base + '/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
