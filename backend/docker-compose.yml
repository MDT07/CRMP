services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crmp
      POSTGRES_USER: crmp
      POSTGRES_PASSWORD: crmp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crmp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmp -d crmp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - crmp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  crmp_postgres_data:
  crmp_redis_data:
